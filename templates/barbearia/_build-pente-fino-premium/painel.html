<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Painel · Pente Fino</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0a0a0a">
  <link rel="icon" href="/marca.svg" type="image/svg+xml">
  <style>html, body { background: #070707; color: #f2f1ee; margin: 0; }</style>
  <link rel="stylesheet" href="/src/styles/cliente.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="marca" viewBox="0 0 48 20"><g fill="currentColor"><rect x="1" y="1" width="46" height="4.4" rx="2.2"/><rect x="1" y="3" width="2.6" height="16" rx="1.3"/><rect x="44.4" y="3" width="2.6" height="16" rx="1.3"/><rect x="6" y="4.6" width="2.2" height="14" rx="1.1"/><rect x="10" y="4.6" width="2.2" height="14" rx="1.1"/><rect x="14" y="4.6" width="2.2" height="14" rx="1.1"/><rect x="18" y="4.6" width="2.2" height="14" rx="1.1"/><rect x="22.9" y="4.6" width="1.3" height="14" rx="0.65"/><rect x="25.6" y="4.6" width="1.3" height="14" rx="0.65"/><rect x="28.3" y="4.6" width="1.3" height="14" rx="0.65"/><rect x="31" y="4.6" width="1.3" height="14" rx="0.65"/><rect x="33.7" y="4.6" width="1.3" height="14" rx="0.65"/><rect x="36.4" y="4.6" width="1.3" height="14" rx="0.65"/><rect x="39.1" y="4.6" width="1.3" height="14" rx="0.65"/><rect x="41.8" y="4.6" width="1.3" height="14" rx="0.65"/></g></symbol>
    </defs>
  </svg>

  <div class="painel">
    <aside class="lateral">
      <a class="lateral__logo" href="./index.html" target="_blank" rel="noopener"><svg class="marca" viewBox="0 0 48 20" aria-hidden="true"><use href="#marca"/></svg>Pente Fino</a>
      <nav class="lateral__nav" aria-label="Seções do painel" data-menu>
        <button type="button" data-aba="servicos">Serviços <b data-conta-aba="servicos"></b></button>
        <button type="button" data-aba="barbeiros">Barbeiros <b data-conta-aba="barbeiros"></b></button>
        <button type="button" data-aba="produtos">Produtos <b data-conta-aba="produtos"></b></button>
        <button type="button" data-aba="loja">Loja e horário</button>
        <button type="button" data-aba="conta">Conta</button>
      </nav>
      <div class="lateral__pe">
        <span class="mono">Demonstração</span>
        <span>Os dados ficam <strong>neste navegador</strong>. Abra o site aqui mesmo para ver as mudanças.</span>
      </div>
    </aside>

    <main class="conteudo" id="conteudo">
      <header class="topo">
        <p class="topo__ola">Olá, <strong data-dono></strong></p>
        <div class="topo__acoes">
          <a class="botao botao--linha botao--pequeno" href="./index.html" target="_blank" rel="noopener">Ver o site ↗</a>
          <button class="botao botao--linha botao--pequeno" type="button" data-sair>Sair</button>
        </div>
      </header>
      <section class="aba" data-painel="servicos" aria-label="Serviços"></section>
      <section class="aba" data-painel="barbeiros" aria-label="Barbeiros" hidden></section>
      <section class="aba" data-painel="produtos" aria-label="Produtos" hidden></section>
      <section class="aba" data-painel="loja" aria-label="Loja e horário" hidden></section>
      <section class="aba" data-painel="conta" aria-label="Conta" hidden></section>
    </main>
  </div>

  <script type="module" src="/src/cliente/painel.js"></script>
</body>
</html>
