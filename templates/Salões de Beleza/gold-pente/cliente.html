<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Área do cliente · Pente Fino</title>
  <meta name="description" content="Entre para cadastrar serviços, barbeiros, produtos e o horário da barbearia.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0a0a0a">
  <link rel="icon" href="./marca.svg" type="image/svg+xml">
  <style>html,body{color:#f2f1ee;background:#070707;margin:0}</style>
  <script type="module" crossorigin src="./assets/cliente-BYQ-64Am.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/dados-pj6Ph-G0.js">
  <link rel="modulepreload" crossorigin href="./assets/comum-CLAC-EA7.js">
  <link rel="stylesheet" crossorigin href="./assets/comum-C9Ue8Lg7.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="marca" viewBox="0 0 48 20"><g fill="currentColor"><rect x="1" y="1" width="46" height="4.4" rx="2.2"/><rect x="1" y="3" width="2.6" height="16" rx="1.3"/><rect x="44.4" y="3" width="2.6" height="16" rx="1.3"/><rect x="6" y="4.6" width="2.2" height="14" rx="1.1"/><rect x="10" y="4.6" width="2.2" height="14" rx="1.1"/><rect x="14" y="4.6" width="2.2" height="14" rx="1.1"/><rect x="18" y="4.6" width="2.2" height="14" rx="1.1"/><rect x="22.9" y="4.6" width="1.3" height="14" rx="0.65"/><rect x="25.6" y="4.6" width="1.3" height="14" rx="0.65"/><rect x="28.3" y="4.6" width="1.3" height="14" rx="0.65"/><rect x="31" y="4.6" width="1.3" height="14" rx="0.65"/><rect x="33.7" y="4.6" width="1.3" height="14" rx="0.65"/><rect x="36.4" y="4.6" width="1.3" height="14" rx="0.65"/><rect x="39.1" y="4.6" width="1.3" height="14" rx="0.65"/><rect x="41.8" y="4.6" width="1.3" height="14" rx="0.65"/></g></symbol>
    </defs>
  </svg>

  <main class="acesso">
    <div class="acesso__arte">
      <img src="./img/espelho-1.webp" alt="" fetchpriority="high">
      <a class="acesso__topo" href="./index.html"><svg class="marca" viewBox="0 0 48 20" aria-hidden="true"><use href="#marca"/></svg>Pente Fino</a>
      <div class="acesso__nome" aria-hidden="true">
        <p>pente</p><p>fino</p>
        <small class="mono">Área do cliente · painel da barbearia</small>
      </div>
    </div>

    <div class="acesso__lado">
      <form class="acesso__form" novalidate data-entrar>
        <p class="mono entra">Área do cliente</p>
        <h1 class="entra"><span>Bem-vindo</span> <strong>de volta.</strong></h1>
        <p class="entra">Cadastre serviços, barbeiros e produtos, e ajuste o horário da casa. O site muda na hora.</p>
        <div class="acesso__erro" role="alert" hidden data-erro></div>
        <label class="campo entra">
          <span>E-mail</span>
          <input type="email" name="email" autocomplete="username" required data-email>
        </label>
        <label class="campo campo--senha entra">
          <span>Senha</span>
          <input type="password" name="senha" autocomplete="current-password" required data-senha>
          <button class="campo__olho" type="button" aria-label="Mostrar a senha" aria-pressed="false" data-olho></button>
        </label>
        <button class="botao botao--claro botao--seta entra" type="submit">Entrar no painel</button>
        <div class="acesso__demo entra">
          <span class="mono">Acesso de demonstração</span>
          <span>E-mail <b data-demo-email></b> · senha <b data-demo-senha></b></span>
        </div>
        <div class="acesso__links entra">
          <span>Ainda não tem conta? <a href="./cadastro.html">Cadastre a barbearia</a></span>
          <a href="./index.html">← Voltar ao site</a>
        </div>
      </form>
    </div>
  </main>

</body>
</html>
